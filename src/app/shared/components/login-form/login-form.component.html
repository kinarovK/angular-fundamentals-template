<h2 class="text-align-center">Login</h2>
<div class="app-plate">
  <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="login-form">
      <div>
        <div class="form__control">
          <label for="email">Email</label>
          <!--Use the name `email` for the form control.-->
          <input
            type="text"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Input text"
            emailValidator
            required
          />
          <span
            *ngIf="loginForm.controls['email']?.errors?.['required'] && loginForm.controls['email']?.touched"
            class="text-danger"
          >
            Email is required.</span
          >
          <span
            *ngIf="loginForm.controls['email']?.errors?.['invalidEmail'] && !loginForm.controls['email']?.errors?.['required']"
            class="text-danger"
          >
            Invalid email format!
          </span>
        </div>
        <div class="form__control">
          <label for="password">Password</label>
          <!--Use the name `password` for the form control.-->
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Input password"
            required
          />
          <span
            *ngIf="loginForm.controls['password']?.errors?.['required'] && loginForm.controls['password']?.touched"
            class="text-danger"
          >
            Password is required.</span
          >
        </div>
      </div>
      <div>
        <div class="form__action">
          <app-button buttonText="Login"></app-button>
        </div>
        <div class="form__text">
          If you don't have an account you may <strong>Registration</strong>
        </div>
      </div>
    </div>
  </form>
</div>
