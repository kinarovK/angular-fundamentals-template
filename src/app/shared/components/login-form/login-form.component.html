<h2 class="text-align-center">Login</h2>
<div class="app-plate">
  <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
    <div class="login-form">
      <div>
        <div class="form__control">
          <label for="email">Email</label>
          <!--Use the name `email` for the form control.-->
          <input
            type="text"
            id="email"
            name="email"
            placeholder="Input text"
            required
            emailValidator
            [(ngModel)]="model.email"
            #email="ngModel"
          />
          <div
            *ngIf="email.invalid && email.touched"
            id="emailErrorMessage"
            class="text-danger"
          >
            <div *ngIf="email.errors?.['required']">Email is required.</div>
            <div *ngIf="email.errors?.['invalidEmail']">Invalid email.</div>
          </div>
        </div>
        <div class="form__control">
          <label for="password">Password</label>
          <!--Use the name `password` for the form control.-->
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Input password"
            [(ngModel)]="model.password"
            #password="ngModel"
          />
          <div
            *ngIf="password.invalid && password.touched"
            id="passwordErrorMessage"
            class="text-danger"
          >
            Password is required.
          </div>
        </div>
      </div>
      <div>
        <div class="form__action">
          <app-button buttonText="Login"></app-button>
        </div>
        <div class="form__text">
          If you don't have an account you may <strong>Registration</strong>
        </div>
      </div>
    </div>
  </form>
</div>
